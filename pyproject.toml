[project]
name = "support-copilot"
version = "0.1.0"
description = "Copilot de suporte: triagem clássica, RAG, Guardrails, drift e LGPD (Datathon FIAP)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.6",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "scikit-learn>=1.5",
    "pandas>=2.2,<3",
    "numpy>=1.26",
    "joblib>=1.4",
    "mlflow>=2.14",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-community>=0.3",
    "langchain-text-splitters>=0.3",
    "langchain-google-genai>=2.0",
    "langchain-openai>=0.2",
    "faiss-cpu>=1.8",
    "pypdf>=4.0",
    "evidently>=0.4",
    "fpdf2>=2.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "venv", "build", "dist", "mlruns"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: requires LLM API key",
]
